<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ubicación de Firmas E-digital (V4.11 - Validación PDF & Fixes)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <style>
        :root {
            --color-primario: #00C853; --color-secundario: #157347; 
            --color-blanco: #FFFFFF; --color-gris: #CCCCCC;
            --color-texto: #333333; --color-fondo: #f4f7f6;
            --color-peligro: #e74c3c;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--color-fondo); color: var(--color-texto); display: flex; flex-direction: column; align-items: center; padding: 20px 10px; margin: 0; overflow-x: hidden; }
        .panel { background: var(--color-blanco); padding: 30px 20px; border-radius: 12px; width: 100%; max-width: 800px; box-sizing: border-box; box-shadow: 0 4px 20px rgba(0,0,0,0.05); text-align: center; margin-bottom: 20px; border: 1px solid var(--color-gris); }
        h2 { margin-top: 0; color: var(--color-secundario); font-size: 24px; }
        
        /* Área de carga mejorada */
        .upload-area { border: 2px dashed var(--color-gris); border-radius: 8px; padding: 30px 10px; cursor: pointer; background: #fafafa; margin-bottom: 20px; display: block; transition: 0.3s; word-wrap: break-word; }
        .upload-area:hover, .upload-area.dragover { border-color: var(--color-primario); background: rgba(0, 200, 83, 0.05); }
        #pdfFile { display: none; }
        
        button { background: var(--color-secundario); color: var(--color-blanco); border: none; padding: 12px 20px; font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; margin: 5px; }
        button:hover { background: var(--color-primario); transform: scale(1.02); }
        button:disabled { background: var(--color-gris); color: #888; cursor: not-allowed; opacity: 0.6; }
        
        input:disabled { background: #e9ecef; color: #6c757d; cursor: not-allowed; border-color: var(--color-gris); }
        
        .btn-add-auto { background: var(--color-primario); display: none; }
        .btn-save { background: var(--color-secundario); display: none; }
        .btn-reset { background: var(--color-peligro); display: none; }
        
        .botones-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 15px; }
        #paginacion-container { display: none; align-items: center; justify-content: center; gap: 15px; margin-top: 15px; background: #f8f9fa; padding: 10px; border-radius: 8px; border: 1px solid var(--color-gris); }
        
        #visor-container { display: none; margin-top: 20px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.2); background: var(--color-blanco); max-width: 100%; overflow: hidden; border: 1px solid var(--color-gris); }
        canvas { display: block; max-width: 100%; height: auto; }
        
        .firma-box { position: absolute; background: rgba(0, 200, 83, 0.15); border: 2px solid var(--color-primario); color: var(--color-secundario); font-weight: bold; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: grab; user-select: none; border-radius: 4px; text-align: center; box-sizing: border-box; z-index: 10; font-size: 12px; }
        .btn-cerrar-firma { position: absolute; top: -8px; right: -8px; background: var(--color-peligro); color: var(--color-blanco); width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; z-index: 20; }
        
        /* GUIAS MAGNÉTICAS (VERDES) */
        .guia-magnetica { position: absolute; background-color: var(--color-primario); display: none; pointer-events: none; z-index: 5; opacity: 0.8; }
        #guia-v { width: 1.5px; height: 100%; top: 0; }
        #guia-h { height: 1.5px; width: 100%; left: 0; }

        .loader-container { text-align: center; margin-top: 20px; }
        .spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid rgba(0, 200, 83, 0.2); border-top: 3px solid var(--color-primario); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="panel">
        <h2>Ubicación de Firmas</h2>
        <p>Sube el documento PDF y posiciona las Firmas.</p>
        
        <label for="pdfFile" class="upload-area" id="drop-area">
            <span style="font-size: 30px;">📄</span><br><br>
            <span id="file-label" style="font-weight: bold; color: var(--color-secundario);">Toca aquí o arrastra tu archivo PDF</span>
        </label>
        <input type="file" id="pdfFile" accept="application/pdf" onchange="mostrarNombreArchivo()">
        
        <div class="botones-container">
            <button id="btnProcesar" onclick="procesarPDF()">1. Procesar Documento</button>
            <button id="btnGenerar" class="btn-add-auto" onclick="agregarSiguienteFirma()">2. Añadir Firma</button>
            <button id="btnReset" class="btn-reset" onclick="limpiarFirmas()">Eliminar Firmas</button>
            <button id="btnGuardar" class="btn-save" onclick="enviarAE_digital()">3. Guardar Configuración</button>
        </div>
        
        <div id="paginacion-container">
            <button id="btnAnterior" onclick="cambiarPagina(-1)">◀ Anterior</button>
            <span>Página <input type="number" id="input-pagina" style="width: 45px; text-align: center; border: 1px solid #ccc; border-radius: 4px; padding: 4px;" value="1" onchange="irAPagina()"> de <span id="total-paginas">1</span></span>
            <button id="btnSiguiente" onclick="cambiarPagina(1)">Siguiente ▶</button>
        </div>

        <div id="loader" class="loader-container" style="display:none;">
            <div class="spinner"></div>
            <p>Procesando...</p>
        </div>
    </div>

    <div id="visor-container">
        <canvas id="pdf-canvas"></canvas>
        <div id="guia-v" class="guia-magnetica"></div>
        <div id="guia-h" class="guia-magnetica"></div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pdfGlobal = null, paginaActualNum = 1, totalPaginasGlobal = 1;
        let pageHeight = 0, pageWidth = 0, currentScale = 1.0;
        let currentJson = { positions: {} }, cantidadFirmantes = 0;
        let anclajesEncontrados = [], lowestTextY = 100;
        let FIRMA_W = 160, FIRMA_H = 56;
        const UMBRAL_MAGNETICO = 12; // Define la fuerza del imán para la alineación

        // --- VALIDACIÓN DE PDF Y DRAG & DROP RESTAURADA ---
        function validarArchivo(file) {
            if (file.type !== "application/pdf" && !file.name.toLowerCase().endsWith('.pdf')) {
                alert("❌ Archivo inválido. Por favor, sube ÚNICAMENTE un documento en formato PDF.");
                document.getElementById('pdfFile').value = ""; 
                document.getElementById('file-label').textContent = "⚠️ Error: Solo se aceptan archivos PDF";
                document.getElementById('file-label').style.color = "var(--color-peligro)";
                document.getElementById('drop-area').style.borderColor = "var(--color-peligro)";
                
                setTimeout(() => {
                    document.getElementById('file-label').textContent = "Toca aquí o arrastra tu archivo PDF";
                    document.getElementById('file-label').style.color = "var(--color-secundario)";
                    document.getElementById('drop-area').style.borderColor = "var(--color-gris)";
                }, 3500);
                return false;
            }
            return true;
        }

        // Muestra el nombre del archivo cargado exitosamente
        function mostrarNombreArchivo() {
            const input = document.getElementById('pdfFile');
            const label = document.getElementById('file-label');
            if(input.files.length > 0) {
                const file = input.files[0];
                if (validarArchivo(file)) {
                    label.innerText = "✅ " + file.name;
                    label.style.color = "var(--color-primario)";
                    document.getElementById('drop-area').style.borderColor = "var(--color-primario)";
                }
            }
        }

        // Eventos Drag and Drop
        const dropArea = document.getElementById('drop-area');
        dropArea.addEventListener('dragover', (e) => { e.preventDefault(); dropArea.classList.add('dragover'); });
        dropArea.addEventListener('dragleave', () => { dropArea.classList.remove('dragover'); });
        dropArea.addEventListener('drop', (e) => { 
            e.preventDefault(); 
            dropArea.classList.remove('dragover'); 
            if(e.dataTransfer.files.length) { 
                const file = e.dataTransfer.files[0];
                if (validarArchivo(file)) {
                    const dataTransfer = new DataTransfer();
                    dataTransfer.items.add(file);
                    document.getElementById('pdfFile').files = dataTransfer.files; 
                    mostrarNombreArchivo();
                }
            } 
        });
        // ----------------------------------------------------

        // Recibe las configuraciones (Metadatos) enviadas desde el backend
        window.addEventListener('message', function(event) {
            if (event.data && event.data.tipo === 'CONFIGURAR_FIRMAS') {
                cantidadFirmantes = parseInt(event.data.cantidad) || 0;
                if (event.data.metadata && event.data.metadata.ancho) {
                    FIRMA_W = parseInt(event.data.metadata.ancho);
                    FIRMA_H = parseInt(event.data.metadata.alto);
                } else {
                    FIRMA_W = [1, 2, 4].includes(cantidadFirmantes) ? 200 : 160;
                    FIRMA_H = [1, 2, 4].includes(cantidadFirmantes) ? 70 : 56;
                }
                if (pdfGlobal) actualizarUI();
            }
        });

        // Inicia el análisis y lectura del documento PDF cargado
        async function procesarPDF() {
            const file = document.getElementById('pdfFile').files[0];
            if (!file) return alert("Selecciona un PDF.");
            
            if (!validarArchivo(file)) return;

            document.getElementById('btnProcesar').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            try {
                const fileURL = URL.createObjectURL(file);
                pdfGlobal = await pdfjsLib.getDocument(fileURL).promise;
                totalPaginasGlobal = pdfGlobal.numPages;
                document.getElementById('total-paginas').innerText = totalPaginasGlobal;
                await renderizarPagina();
                document.getElementById('visor-container').style.display = 'block';
                document.getElementById('paginacion-container').style.display = 'flex';
                document.getElementById('btnGuardar').style.display = 'inline-block';
                restaurarBorradorLocal();
                actualizarUI();
            } catch (e) { alert("Error: " + e.message); }
            finally { document.getElementById('loader').style.display = 'none'; }
        }

       

        /*
         * FUNCIÓN: renderizarPagina
         * Propósito: Dibuja el PDF, escanea el texto buscando anclajes cortos (evitando párrafos),
         * fusiona palabras cercanas, fuerza la alineación Y (altura) y asigna posiciones semánticas.
         */
        async function renderizarPagina() {
            const page = await pdfGlobal.getPage(paginaActualNum);
            const vp = page.getViewport({ scale: 1.0 });
            pageWidth = vp.width; pageHeight = vp.height;

            const claves = ["rut", "run", "c.i", "c.i.", "cedula", "dni", "ruc", "c.e.", "curp", "rfc", "ine", "ife", "patron", "firma", "empleador", "trabajador", "empleado", "empresa", "representante", "apoderado", "cliente", "proveedor", "contratante", "contratista", "arrendador", "arrendatario", "vendedor", "comprador"];
            
            try {
                const text = await page.getTextContent();
                let findsRaw = [];
                let minY = pageHeight;

                text.items.forEach(it => {
                    let txt = it.str.trim().toLowerCase();
                    if (it.transform[5] < minY) minY = it.transform[5];

                    // 1. REGLA DE CARACTERES: Ignorar párrafos, buscar solo etiquetas cortas
                    if (txt.length > 0 && txt.length <= 40) {
                        if (claves.some(p => txt.includes(p))) {
                            findsRaw.push({ x: it.transform[4], y: it.transform[5], texto: txt });
                        }
                    }
                });
                
                let findsFiltrados = [];

                // 2. FILTRO ANTI-DUPLICADOS Y FUSIÓN DE TEXTO:
                // Si lee "Firma" y "Empleador" separados pero muy cerca, los une en un solo texto.
                // Esto evita que el sistema gaste 2 cajas en el mismo lugar.
                findsRaw.forEach(raw => {
                    let existente = findsFiltrados.find(f => Math.abs(f.x - raw.x) < 80 && Math.abs(f.y - raw.y) < 30);
                    if (existente) {
                        existente.texto += " " + raw.texto; // Ej: "firma" + " " + "empleador"
                    } else {
                        findsFiltrados.push({ x: raw.x, y: raw.y, texto: raw.texto });
                    }
                });

                // 3. ALINEACIÓN FORZADA (EJE Y):
                // Garantiza que las firmas que están en la misma línea visual compartan el mismo Y exacto.
                if (findsFiltrados.length > 0) {
                    let lineasDetectadas = [];
                    findsFiltrados.forEach(f => {
                        let linea = lineasDetectadas.find(l => Math.abs(l.yBase - f.y) <= 20);
                        if (linea) f.y = linea.yBase; 
                        else lineasDetectadas.push({ yBase: f.y });
                    });
                }

                // 4. ORDENAMIENTO ESTÁNDAR (Izquierda a Derecha)
                findsFiltrados.sort((a, b) => {
                    if (Math.abs(a.y - b.y) > 20) return a.y - b.y; // De abajo hacia arriba
                    return a.x - b.x; // Izquierda a derecha
                });

                // 5. ASIGNACIÓN SEMÁNTICA (El cerebro de la ubicación)
                // Buscamos quién es quién leyendo el texto fusionado
                let anclajeEmpleador = findsFiltrados.find(f => /empleador|patron|empresa/.test(f.texto));
                let anclajeTrabajador = findsFiltrados.find(f => /trabajador|empleado/.test(f.texto));
                
                let anclajesOrdenados = [];
                
                // Forzamos: Firmante 1 SIEMPRE al Empleador, Firmante 2 SIEMPRE al Trabajador
                if (anclajeEmpleador) anclajesOrdenados[0] = anclajeEmpleador;
                if (anclajeTrabajador) anclajesOrdenados[1] = anclajeTrabajador;

                // Rellenar los huecos con el resto de anclajes (los códigos QR o firmas extra)
                let anclajesRestantes = findsFiltrados.filter(f => f !== anclajeEmpleador && f !== anclajeTrabajador);
                
                let index = 0;
                while (anclajesOrdenados.length < findsFiltrados.length || anclajesRestantes.length > 0) {
                    if (anclajesOrdenados[index] === undefined && anclajesRestantes.length > 0) {
                        anclajesOrdenados[index] = anclajesRestantes.shift();
                    }
                    index++;
                }

                // Limpiamos de posiciones vacías
                anclajesEncontrados = anclajesOrdenados.filter(a => a !== undefined);
                
                // 6. PREPARAR GRILLA 3x3: Punto más bajo si no hay anclajes
                lowestTextY = minY - (FIRMA_H + 30); 
                if (lowestTextY < 0) lowestTextY = 20; 
            } catch(e) { lowestTextY = 50; }

            currentScale = Math.min(window.innerWidth - 30, 800) / pageWidth;
            const viewport = page.getViewport({ scale: currentScale });
            const canvas = document.getElementById('pdf-canvas');
            canvas.width = viewport.width; canvas.height = viewport.height;
            await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
            
            reubicarCajasExistentes();
            validarBotonesPaginacion();
        }

        /**
         * FUNCIÓN: agregarSiguienteFirma
         * Propósito: Ubica la caja consumiendo los anclajes semánticos perfectos.
         * Si el documento viene en blanco, aplica la grilla de 3 cajas por fila.
         */
        function agregarSiguienteFirma() {
            let num = 0;
            for(let i=1; i<=cantidadFirmantes; i++) {
                if(!currentJson.positions['signer-'+i]) { num = i; break; }
            }
            if(!num) return;

            const key = 'signer-' + num;
            let pX = 50, pY = lowestTextY;

            if(anclajesEncontrados[num-1]) {
                // CASO A: Anclaje Semántico (Centrado perfecto sobre el texto)
                let anclaje = anclajesEncontrados[num-1];
                let anchoDelTexto = anclaje.anchoTexto || 100;
                
                // Cálculo del centro matemático
                pX = (anclaje.x + (anchoDelTexto / 2)) - (FIRMA_W / 2);
                pY = anclaje.y + 40; 

                // ANTI-SOLAPAMIENTO: Si se tocan o pegan, las separamos a la fuerza
                Object.keys(currentJson.positions).forEach(k => {
                    let posExistente = currentJson.positions[k];
                    
                    // Verificamos si están en la misma línea (altura)
                    if (Math.abs(posExistente.y - pY) < 30) {
                        let margen = 15; // 15px de espacio en blanco obligatorio
                        
                        // Si la caja nueva se monta o pega a la existente
                        if (pX + FIRMA_W + margen > posExistente.x && pX < posExistente.x + FIRMA_W + margen) {
                            if (pX < posExistente.x) {
                                pX = posExistente.x - FIRMA_W - margen; // La empuja a la izquierda
                            } else {
                                pX = posExistente.x + FIRMA_W + margen; // La empuja a la derecha
                            }
                        }
                    }
                });
            } else {
                // CASO B: Grilla de 3 Firmas lado a lado
                let indiceGrilla = num - 1; 
                let fila = Math.floor(indiceGrilla / 3);  
                let columna = indiceGrilla % 3;           

                let margenLateral = 40;
                let espacioDisponible = pageWidth - (margenLateral * 2);
                let gapX = (espacioDisponible - (FIRMA_W * 3)) / 2;
                if (gapX < 15) gapX = 15; 

                pX = margenLateral + (columna * (FIRMA_W + gapX));
                pY = lowestTextY - (fila * (FIRMA_H + 20)); 
            }

            // CLAMPING: Nunca salir de la hoja
            pX = Math.max(0, Math.min(pX, pageWidth - FIRMA_W));
            pY = Math.max(0, Math.min(pY, pageHeight - FIRMA_H));

            currentJson.positions[key] = { x: Math.round(pX), y: Math.round(pY), pagina: paginaActualNum };
            dibujarCaja(key, currentJson.positions[key]);
            actualizarUI();
            autoGuardarLocal();
        }
        // Inserta la caja HTML en el visor, aplicando el arrastre y guías magnéticas
        function dibujarCaja(key, pos) {
            if(pos.pagina !== paginaActualNum) return;
            const old = document.getElementById('box-' + key);
            if(old) old.remove();

            const box = document.createElement('div');
            box.id = 'box-' + key; box.className = 'firma-box';
            box.innerHTML = `<div class="btn-cerrar-firma" onclick="eliminarFirma(event, '${key}')">×</div>
                             <span>Firmante ${key.split('-')[1]}</span>`;
            
            document.getElementById('visor-container').appendChild(box);
            
            const wR = FIRMA_W * currentScale;
            const hR = FIRMA_H * currentScale;
            box.style.width = wR + 'px'; box.style.height = hR + 'px';
            box.style.left = (pos.x * currentScale) + "px";
            box.style.top = ((pageHeight - pos.y - FIRMA_H) * currentScale) + "px";
            
            // --- ARRASTRE SUAVE Y GUÍAS (CORREGIDO) ---
            box.onmousedown = (e) => {
                if(e.target.className.includes('cerrar')) return;
                e.preventDefault(); 
                
                // 1. Guardamos el punto exacto del click inicial
                let startMouseX = e.clientX;
                let startMouseY = e.clientY;
                let startBoxLeft = box.offsetLeft;
                let startBoxTop = box.offsetTop;
                
                const guiaV = document.getElementById('guia-v');
                const guiaH = document.getElementById('guia-h');
                
                document.onmousemove = (ev) => {
                    // 2. Calculamos la diferencia desde el click (esto evita que tiemble o se trabe)
                    let deltaX = ev.clientX - startMouseX;
                    let deltaY = ev.clientY - startMouseY;
                    
                    let nL = startBoxLeft + deltaX;
                    let nT = startBoxTop + deltaY;

                    // 3. Clamping (No salir del PDF)
                    if (nL < 0) nL = 0; if (nT < 0) nT = 0;
                    if (nL + wR > pageWidth * currentScale) nL = (pageWidth * currentScale) - wR;
                    if (nT + hR > pageHeight * currentScale) nT = (pageHeight * currentScale) - hR;

                    let visualTop = nT;
                    let visualLeft = nL;
                    let snapV = false, snapH = false;

                    // 4. Guías Magnéticas Verdes
                    document.querySelectorAll('.firma-box').forEach(otraCaja => {
                        if (otraCaja.id !== box.id && otraCaja.style.display !== 'none') {
                            let otraTop = otraCaja.offsetTop;
                            let otraLeft = otraCaja.offsetLeft;

                            // 12 es el margen del imán
                            if (Math.abs(nL - otraLeft) < 12) {
                                visualLeft = otraLeft; 
                                snapV = true;
                                guiaV.style.left = visualLeft + "px";
                                guiaV.style.display = "block";
                            }
                            if (Math.abs(nT - otraTop) < 12) {
                                visualTop = otraTop; 
                                snapH = true;
                                guiaH.style.top = visualTop + "px";
                                guiaH.style.display = "block";
                            }
                        }
                    });

                    if (!snapV) guiaV.style.display = "none";
                    if (!snapH) guiaH.style.display = "none";

                    // 5. Aplicar posición final a la caja
                    box.style.top = visualTop + "px"; 
                    box.style.left = visualLeft + "px";
                    
                    // 6. Guardar coordenadas al instante
                    currentJson.positions[key].x = Math.round(visualLeft / currentScale);
                    currentJson.positions[key].y = Math.round(pageHeight - (visualTop / currentScale) - FIRMA_H);
                };
                
                document.onmouseup = () => { 
                    document.onmousemove = null; 
                    document.onmouseup = null; 
                    guiaV.style.display = "none";
                    guiaH.style.display = "none";
                    autoGuardarLocal(); 
                };
            };
        }

        // Restaura en pantalla todas las firmas guardadas al cambiar de página
        function reubicarCajasExistentes() {
            document.querySelectorAll('.firma-box').forEach(b => b.remove());
            Object.keys(currentJson.positions).forEach(k => dibujarCaja(k, currentJson.positions[k]));
        }

        // Elimina una sola firma del sistema
        function eliminarFirma(e, k) { e.stopPropagation(); document.getElementById('box-'+k).remove(); delete currentJson.positions[k]; actualizarUI(); autoGuardarLocal(); }
        
        // Limpia totalmente el lienzo y el JSON
        function limpiarFirmas() {
            if(!confirm("¿Borrar todo?")) return;
            currentJson.positions = {}; reubicarCajasExistentes(); actualizarUI(); autoGuardarLocal();
        }

        // Actualiza botones e interfaces basado en si se completó el cupo de firmas
        function actualizarUI() {
            const count = Object.keys(currentJson.positions).length;
            const btn = document.getElementById('btnGenerar');
            btn.style.display = 'inline-block';
            btn.innerText = count >= cantidadFirmantes ? "✅ Completado" : `2. Añadir Firma (${count}/${cantidadFirmantes})`;
            btn.disabled = (count >= cantidadFirmantes || cantidadFirmantes === 0);
            document.getElementById('btnReset').style.display = count > 0 ? 'inline-block' : 'none';
        }

        function validarBotonesPaginacion() {
            document.getElementById('btnAnterior').disabled = (paginaActualNum <= 1);
            document.getElementById('btnSiguiente').disabled = (paginaActualNum >= totalPaginasGlobal);
            
            const inputPagina = document.getElementById('input-pagina');
            inputPagina.value = paginaActualNum;
            inputPagina.disabled = (totalPaginasGlobal <= 1);
        }

        function cambiarPagina(d) { 
            paginaActualNum += d; 
            renderizarPagina(); 
        }

        function irAPagina() { 
            const inputPagina = document.getElementById('input-pagina');
            let v = parseInt(inputPagina.value); 
            if (isNaN(v) || v < 1) v = 1; 
            else if (v > totalPaginasGlobal) v = totalPaginasGlobal; 

            if (paginaActualNum !== v) {
                paginaActualNum = v; 
                renderizarPagina(); 
            } else {
                inputPagina.value = paginaActualNum; 
            }
        }

        // Permite que las posiciones sobrevivan si el usuario recarga la ventana
        function autoGuardarLocal() {
            const f = document.getElementById('pdfFile').files[0];
            if(f) localStorage.setItem('borrador_' + f.name, JSON.stringify({ p: currentJson.positions, c: cantidadFirmantes, w: FIRMA_W, h: FIRMA_H }));
        }

        // Lee y restaura la memoria local al abrir un PDF previamente editado
        function restaurarBorradorLocal() {
            const f = document.getElementById('pdfFile').files[0];
            const s = f ? localStorage.getItem('borrador_' + f.name) : null;
            if(s) {
                const d = JSON.parse(s); currentJson.positions = d.p;
                if(!cantidadFirmantes) { cantidadFirmantes = d.c; FIRMA_W = d.w; FIRMA_H = d.h; }
                reubicarCajasExistentes();
            }
        }

        // Finaliza el proceso y envía los datos mediante mensaje al Backend
        function enviarAE_digital() {
            const keys = Object.keys(currentJson.positions);
            if (keys.length < cantidadFirmantes) return alert(`Faltan firmas (${keys.length}/${cantidadFirmantes})`);

            let coords = {};
            keys.forEach(k => {
                let p = currentJson.positions[k];
                coords[k] = {
                    x: Number(p.x),
                    y: Number(p.y),
                    y_invertida: Math.round(pageHeight - p.y),
                    pagina: Number(p.pagina)
                };
            });

            const msg = {
                tipo: 'GUARDAR_PLANTILLA_FIRMAS',
                datos: {
                    coordenadas: coords,
                    total: cantidadFirmantes,
                    dimensiones: { w: FIRMA_W, h: FIRMA_H }
                }
            };

            console.log("ENVIANDO:", msg);
            window.parent.postMessage(msg, '*');
            alert("Enviado correctamente.");
        }
    </script>
</body>
</html>
